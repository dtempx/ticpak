[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticpak"
version = "0.2.1"
description = "Package a multi-file TIC-80 Lua project into one distributable cart: inline the modules, minify, boot-test headless, save the .tic and check its limits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dtempx" }]
requires-python = ">=3.9"
keywords = ["tic-80", "tic80", "fantasy-console", "lua", "minifier", "bundler", "gamedev"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
# nicer arrow-key prompts in interactive mode (plain numbered prompts without it)
prompts = ["questionary>=2"]
# the test suites run original and minified code in a real Lua 5.3
test = ["lupa>=2"]

[project.scripts]
ticpak = "ticpak.cli:main"

[project.urls]
Homepage = "https://github.com/dtempx/ticpak"
Issues = "https://github.com/dtempx/ticpak/issues"

[tool.hatch.build.targets.sdist]
include = ["ticpak", "docs", "skills", "tests", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["ticpak"]
